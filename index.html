<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daybook — Calendar</title>
  <meta name="description" content="Daybook: a clean month-view calendar with events and New York City weather for every day.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Daybook — Calendar">
  <meta property="og:description" content="A clean month-view calendar with events and New York City weather for every day.">
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <a class="brand" href="./">
      <img src="logo.svg" alt="" width="28" height="28">
      <span>Daybook</span>
    </a>
    <div class="nav">
      <button id="prev" aria-label="Previous month">&lsaquo;</button>
      <h1 id="month-title" aria-live="polite"></h1>
      <button id="next" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="actions">
      <button id="today">Today</button>
      <button id="add" class="primary">+ Add Event</button>
    </div>
  </header>

  <main>
    <!-- Hidden from screen readers: each day button announces its own weekday -->
    <div class="weekdays" aria-hidden="true">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div id="grid" class="grid"></div>
    <p class="credit">Weather for New York City · data by <a href="https://open-meteo.com/">Open-Meteo.com</a></p>
  </main>

  <dialog id="modal" aria-labelledby="modal-title">
    <form id="event-form" novalidate>
      <h2 id="modal-title">Add Event</h2>

      <label for="f-title">Title <span aria-hidden="true">*</span></label>
      <input id="f-title" name="title" type="text" maxlength="100" autocomplete="off"
             aria-required="true" aria-describedby="err-title">
      <p class="error" id="err-title" data-for="title"></p>

      <label for="f-date">Date <span aria-hidden="true">*</span></label>
      <input id="f-date" name="date" type="date" aria-required="true" aria-describedby="err-date">
      <p class="error" id="err-date" data-for="date"></p>

      <div class="row">
        <div>
          <label for="f-start">Start time</label>
          <input id="f-start" name="startTime" type="time">
        </div>
        <div>
          <label for="f-end">End time</label>
          <input id="f-end" name="endTime" type="time" aria-describedby="err-endTime">
        </div>
      </div>
      <p class="error" id="err-endTime" data-for="endTime"></p>

      <label for="f-desc">Description</label>
      <textarea id="f-desc" name="description" rows="3" maxlength="500" aria-describedby="err-description"></textarea>
      <p class="error" id="err-description" data-for="description"></p>

      <div class="modal-actions">
        <button type="button" id="delete" class="danger">Delete</button>
        <span class="spacer"></span>
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
